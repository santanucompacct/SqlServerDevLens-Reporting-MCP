name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: reporting-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]' build
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: devlens-reporting-python-package
          path: dist/*
  sqlserver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_SQL_SERVER: localhost,1433
      TEST_SQL_SA_PASSWORD: Synthetic-CI-Password-123!
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Synthetic-CI-Password-123!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bound system dependency downloads
        run: |
          printf '%s\n' 'Acquire::ForceIPv4 "true";' 'Acquire::Retries "1";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-devlens-ci >/dev/null
      - name: Install SQL Server ODBC driver
        run: |
          curl --connect-timeout 15 --max-time 90 --retry 2 -fsSL https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -o /tmp/microsoft-prod.deb
          sudo dpkg -i /tmp/microsoft-prod.deb
          # The Azure HTTP Ubuntu mirror can stall on hosted runners.
          # Refresh indexes from the official HTTPS archive before installing dependencies.
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [[ -f "$source_file" ]]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g;s|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' "$source_file"
            fi
          done
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests/test_sqlserver.py -q
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEVLENS_BROWSER_TEST: '1'
      DEVLENS_SCREENSHOT: setup-desktop.png
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]' playwright
      - name: Bound system dependency downloads
        run: |
          printf '%s\n' 'Acquire::ForceIPv4 "true";' 'Acquire::Retries "1";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-devlens-ci >/dev/null
      - name: Use installed Chrome or install Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            printf 'DEVLENS_CHROMIUM=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - run: python -m pytest tests/test_admin_browser.py -q

      - uses: actions/upload-artifact@v4
        with:
          name: devlens-reporting-setup-preview
          path: setup-desktop.png
