name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]' build
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: devlens-reporting-python-package
          path: dist/*
  sqlserver:
    runs-on: ubuntu-24.04
    env:
      TEST_SQL_SERVER: localhost,1433
      TEST_SQL_SA_PASSWORD: Synthetic-CI-Password-123!
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Synthetic-CI-Password-123!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SQL Server ODBC driver
        run: |
          curl -fsSL https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -o /tmp/microsoft-prod.deb
          sudo dpkg -i /tmp/microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests/test_sqlserver.py -q
  browser:
    runs-on: ubuntu-24.04
    env:
      DEVLENS_BROWSER_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/test_admin_browser.py -q
