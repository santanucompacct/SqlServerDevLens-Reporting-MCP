name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: reporting-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]' build
      - run: python -m pytest -q
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: devlens-reporting-python-package
          path: dist/*
  sqlserver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_SQL_SERVER: localhost,1433
      TEST_SQL_SA_PASSWORD: Synthetic-CI-Password-123!
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Synthetic-CI-Password-123!
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use the official ODBC driver bundled with the SQL Server image
        env:
          SQL_CONTAINER: ${{ job.services.sqlserver.id }}
        shell: bash
        run: |
          set -euo pipefail
          sql_driver_dir="$RUNNER_TEMP/devlens-odbc"
          mkdir -p "$sql_driver_dir/lib" "$sql_driver_dir/config"
          docker cp "$SQL_CONTAINER:/opt/microsoft/msodbcsql18" "$sql_driver_dir/msodbcsql18"
          for library in libodbc.so.2 libodbcinst.so.2 libltdl.so.7; do
            docker cp -L "$SQL_CONTAINER:/usr/lib/x86_64-linux-gnu/$library" "$sql_driver_dir/lib/$library"
          done
          driver_file=$(find "$sql_driver_dir/msodbcsql18/lib64" -name 'libmsodbcsql-18*.so*' -type f -print -quit)
          test -n "$driver_file"
          printf '[ODBC Driver 18 for SQL Server]\nDriver=%s\nUsageCount=1\n' "$driver_file" > "$sql_driver_dir/config/odbcinst.ini"
          printf 'ODBCSYSINI=%s\n' "$sql_driver_dir/config" >> "$GITHUB_ENV"
          printf 'LD_LIBRARY_PATH=%s%s\n' "$sql_driver_dir/lib" "${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - run: python -m pip install '.[test]'
      - run: python -m pytest tests/test_sqlserver.py -q
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEVLENS_BROWSER_TEST: '1'
      DEVLENS_SCREENSHOT: setup-desktop.png
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[test]' playwright
      - name: Bound system dependency downloads
        run: |
          printf '%s\n' 'Acquire::ForceIPv4 "true";' 'Acquire::Retries "1";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-devlens-ci >/dev/null
      - name: Use installed Chrome or install Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            printf 'DEVLENS_CHROMIUM=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - run: python -m pytest tests/test_admin_browser.py -q

      - uses: actions/upload-artifact@v4
        with:
          name: devlens-reporting-setup-preview
          path: setup-desktop.png
