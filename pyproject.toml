[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devlens-reporting"
version = "0.1.4"
description = "Catalog-driven read-only SQL Server reporting over MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp==1.29.0", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pyodbc>=5.2,<6"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
devlens-reporting = "devlens_reporting.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
devlens_reporting = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
